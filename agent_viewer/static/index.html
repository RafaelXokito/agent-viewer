<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>agent-viewer</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/graph.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="appbar">
    <a class="brand" href="#/">agent-viewer</a>
    <span class="appbar-note">read-only</span>
    <span class="spacer"></span>
    <span id="connection" class="connection" role="status" aria-live="polite" data-state="connecting">connecting</span>
    <button id="theme-toggle" class="btn btn-small" type="button">theme: auto</button>
  </header>
  <div id="fatal"></div>
  <main id="main"></main>
  <noscript>agent-viewer needs JavaScript enabled.</noscript>
</body>
</html>
